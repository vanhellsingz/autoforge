name: AutoForge complete validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autoforge-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and complete unit/integration suite (tool fixtures)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/autoforge-evidence"
          for file in *.mjs plus/*.mjs studio/*.mjs studio/next/*.mjs; do node --check "$file"; done
          if ! node --test --test-reporter=junit tests/*.test.mjs plus/tests/*.test.mjs studio/tests/*.test.mjs studio/next/tests/*.test.mjs > "$RUNNER_TEMP/autoforge-evidence/unit-results.xml"; then
            cat "$RUNNER_TEMP/autoforge-evidence/unit-results.xml"
            exit 1
          fi
          node record-validation.mjs --junit "$RUNNER_TEMP/autoforge-evidence/unit-results.xml" --out "$RUNNER_TEMP/autoforge-evidence/unit-report.json" --environment "github-actions-${{ matrix.os }}"
      - name: Publish verifiable test evidence without artifact quota
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/autoforge-evidence/unit-report.json" ]; then
            node ci-evidence.mjs emit "$RUNNER_TEMP/autoforge-evidence"
          elif [ -f "$RUNNER_TEMP/autoforge-evidence/unit-results.xml" ]; then
            node studio/autoforge.mjs bridge --root "$RUNNER_TEMP/autoforge-evidence" --files unit-results.xml
          else
            echo '::error::Test process produced no evidence'
            exit 1
          fi
